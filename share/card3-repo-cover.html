<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1440px;
    background:#0d1117;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(31,111,235,.10), transparent 55%),
      repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(230,237,243,.03) 80px),
      repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(230,237,243,.03) 80px);
    font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    color:#e6edf3; display:flex; flex-direction:column;
    padding:72px 80px; overflow:hidden;
  }
  .tag {
    display:inline-flex; align-items:center; gap:14px;
    font-size:26px; letter-spacing:4px; color:#7d8590;
  }
  .tag .dot { width:12px; height:12px; border-radius:50%; background:#3fb950; box-shadow:0 0 12px #3fb950; }
  h1 { margin-top:56px; font-size:72px; line-height:1.3; letter-spacing:1px; }
  h1 em { font-style:normal; color:#1f6feb; }
  .sub { margin-top:22px; font-size:34px; color:#7d8590; line-height:1.6; }
  .features { margin-top:52px; display:flex; flex-direction:column; gap:26px; }
  .feat {
    display:flex; align-items:center; gap:28px;
    padding:32px 36px; border-radius:16px; border:1px solid #30363d;
    background:#161b22;
  }
  .feat .icon {
    width:72px; height:72px; border-radius:18px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:38px; font-weight:700;
  }
  .feat.f1 .icon { background:rgba(248,81,73,.15); color:#f85149; }
  .feat.f2 .icon { background:rgba(31,111,235,.15); color:#1f6feb; }
  .feat.f3 .icon { background:rgba(63,185,80,.15); color:#3fb950; }
  .feat .txt h3 { font-size:34px; font-weight:700; margin-bottom:8px; }
  .feat .txt p  { font-size:27px; color:#7d8590; line-height:1.5; }
  .stats {
    margin-top:44px; display:flex; gap:20px;
  }
  .stat {
    flex:1; text-align:center; padding:28px 12px;
    border-radius:14px; border:1px solid #21262d; background:#0d1117;
  }
  .stat .num { font-size:52px; font-weight:700; color:#1f6feb; font-family:'Cascadia Code',Consolas,monospace; }
  .stat .lbl { font-size:24px; color:#7d8590; margin-top:8px; }
  .foot {
    margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end;
    border-top:1px solid #21262d; padding-top:36px;
  }
  .repo { font-family:'Cascadia Code',Consolas,monospace; font-size:30px; color:#1f6feb; font-weight:700; }
  .idx  { font-family:'Cascadia Code',Consolas,monospace; font-size:26px; color:#30363d; letter-spacing:6px; }
</style>
</head>
<body>
  <div class="tag"><span class="dot"></span>edge-tts · 踩坑实录 <span style="color:#1f6feb">#03</span></div>

  <h1>Edge TTS<br><em>语音生成工具</em></h1>
  <div class="sub">微软在线语音合成 · tkinter GUI · 便携 exe</div>

  <div class="features">
    <div class="feat f1">
      <div class="icon">403</div>
      <div class="txt"><h3>鉴权 403 自检</h3><p>运行时识别微软鉴权拒绝，自动弹升级指引</p></div>
    </div>
    <div class="feat f2">
      <div class="icon">↻</div>
      <div class="txt"><h3>启动版本预警</h3><p>异步查 PyPI 最新版，落后即状态栏提示</p></div>
    </div>
    <div class="feat f3">
      <div class="icon">EXE</div>
      <div class="txt"><h3>便携单文件</h3><p>PyInstaller 打包，拷到任何 Win 电脑即用</p></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num">7.3.1</div><div class="lbl">edge-tts 版本</div></div>
    <div class="stat"><div class="num">44MB</div><div class="lbl">便携 exe</div></div>
    <div class="stat"><div class="num">300+</div><div class="lbl">在线语音</div></div>
  </div>

  <div class="foot">
    <span class="repo">github.com/DczAnt/edge-tts-voice-tool</span>
    <span class="idx">03 / 03</span>
  </div>
</body>
</html>
